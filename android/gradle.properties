org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin's incremental caches cannot be closed on this toolchain: every
# plugin module fails with "Could not close incremental caches ...
# class-fq-name-to-source.tab", including first-party ones like
# url_launcher_android, so it is the compiler and not our dependencies.
# Full compilation is slower per build and actually produces an APK.
kotlin.incremental=false
